# Local development stack.
#
#   docker compose up -d --build
#
#   API: http://localhost:3000   (health: /up)
#
# The project root is mounted at /var/www in every app container.
# Containers are prefixed with COMPOSE_PROJECT_NAME; set it in the Laravel .env
# (compose reads that file) or rename the "laravel" defaults below.

x-app: &app
  build:
    context: ./docker/local
    args:
      UID: "${HOST_UID:-1000}"
      GID: "${HOST_GID:-1000}"
  image: ${COMPOSE_PROJECT_NAME:-laravel}:local
  pull_policy: never
  restart: unless-stopped
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /var/www
  volumes:
    - ./:/var/www
    - composer-cache:/home/app/.composer
  networks:
    - app-network
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/local/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/local/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - app

  app:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-app
    environment:
      CONTAINER_ROLE: app

  # Runs Horizon when laravel/horizon is installed, otherwise a plain queue:work
  horizon:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-horizon
    environment:
      CONTAINER_ROLE: horizon
    stop_grace_period: 30s

  scheduler:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-scheduler
    environment:
      CONTAINER_ROLE: scheduler

  # Runs Reverb when laravel/reverb is installed, otherwise idles
  reverb:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-reverb
    environment:
      CONTAINER_ROLE: reverb
    ports:
      - "${REVERB_PORT:-3003}:8080"

  database:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-database
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-3001}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - ./docker/data/postgres-data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-3002}:6379"
    volumes:
      - ./docker/data/redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-laravel}-network

volumes:
  composer-cache:
